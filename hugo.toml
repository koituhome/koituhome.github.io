baseURL = "https://koituhome.github.io/blogs/"
locale = "en-us"
title = "Koitu's Blog"
theme = "PaperMod"

# GitHub Pages serves a project site under /blogs/, so baseURL must keep that path.
# If you later add a custom domain (CNAME), change baseURL to that domain.

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  title = "Koitu's Blog"
  description = "Personal blog built with Hugo + PaperMod"
  defaultTheme = "auto"     # auto | dark | light
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = "Hi there 👋"
    Content = "Welcome to my blog. I write about software, infrastructure, and things I learn along the way."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/koituhome"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
