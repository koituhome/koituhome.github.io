baseURL = "https://koituhome.github.io/"
theme = "blowfish"
defaultContentLanguage = "en"

# Org user-site (repo named koituhome.github.io) serves at the root.
# Change this if you add a custom domain.

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
